sh.explain.docker=Docker запускає частини сервера в окремих контейнерах. Установіть його вручну та виберіть розпакований перевірений випуск UNYRI.
sh.why.docker=Так сервер однаково працює на Windows і Linux.
sh.explain.name=Телефони підключатимуться за постійним DNS-ім’ям без https:// та шляху. Налаштуйте A-запис на свій публічний IPv4.
sh.why.name=Ім’я потрібне для HTTPS-сертифіката та зберігається в акаунтах.
sh.explain.internet=Локальна адреса потрібна для переадресації портів. WAN-адресу знайдіть у розділі Інтернет роутера; майстер не входить у роутер.
sh.why.internet=Без доступного ззовні IPv4 телефони поза домашнім Wi-Fi не зможуть підключитися.
sh.explain.ports=Дозвольте лише перелічені порти на ПК та перенаправте їх із роутера на LAN-адресу ПК.
sh.why.ports=Роутер має знати, якому комп’ютеру передавати повідомлення та дзвінки.
sh.explain.options=Виберіть кімнати та спосіб реєстрації. Особисті дзвінки працюють і без кімнат.
sh.why.options=Запрошення обмежують реєстрацію, кімнати потребують додаткових ресурсів і портів.
sh.explain.install=Майстер запустить інсталятор вибраного випуску, дочекається локальної готовності, потім перевірить публічний HTTPS.
sh.why.install=Перевірки допомагають відрізнити помилку встановлення від проблем DNS або роутера.
sh.explain.finish=Збережіть адресу та призначте власника на своєму телефоні.
sh.why.finish=Одноразовий код надає вашому акаунту права власника.
sh.dockerWindows=Потрібен Docker Desktop із запущеним WSL 2 backend, Linux containers та Compose 2.24+. Може знадобитися перезавантаження.
sh.dockerLinux=Потрібні Docker Engine, Compose plugin 2.24+, Bash, curl та openssl. Надайте своєму обліковому запису доступ до локального Engine.
sh.dockerMissing=Docker не готовий. Запустіть локальний Linux Engine / WSL 2 та перевірте Compose. Віддалені Docker contexts заборонено.
sh.dockerReady=Локальні Docker та Compose готові.
sh.downloadDocker=Офіційне встановлення Docker
sh.checkAgain=Перевірити знову
sh.bundleHint=Виберіть окремий перевірений випуск SH-5 зі scripts/selfhost/install та docker-compose.selfhost.yml. Один домашній сервер на Docker Engine.
