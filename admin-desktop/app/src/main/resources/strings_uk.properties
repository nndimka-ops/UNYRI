sh.detectIp=Визначити публічний IP
sh.cgnat=WAN-адреса приватна або відрізняється від публічної: можливо, це CGNAT чи другий роутер. Переадресація лише на домашньому роутері не допоможе — замовте публічний IPv4 у провайдера або використайте VPS чи відповідний тунель.
sh.dynamicIp=DDNS змінює DNS, але не TURN: після зміни IP оновіть TURN_EXTERNAL_IP локально у файлі інсталятора та повторіть встановлення; активні дзвінки можуть перерватися.
