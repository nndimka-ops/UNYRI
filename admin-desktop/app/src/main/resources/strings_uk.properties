sh.details=Докладніше
sh.copyLog=Скопіювати журнал для помічника
sh.portBusy.process=%@ займає програма «%@».
sh.portBusy.container=%@ займає сервер «%@» у програмі Docker.
sh.portBusy.unknown=%@ зайнятий. Назву програми визначити не вдалося.
sh.technical.dockerWindows=Для фахівця: Docker Desktop, локальний Linux Engine, WSL 2 backend, Linux containers, Compose 2.24+. Віддалені Docker contexts не підтримуються.
sh.technical.dockerLinux=Для фахівця: Docker Engine, Compose plugin 2.24+, Bash, curl та openssl. Обліковому запису потрібен доступ до локального Engine; віддалені contexts не підтримуються.
sh.technical.bundle=Для фахівця: потрібен окремий розпакований випуск SH-5 зі scripts/selfhost/install.ps1 або install.sh і docker-compose.selfhost.yml. Робочі каталоги Git не приймаються. Один сервер на локальний Docker Engine.
sh.technical.dynamicIp=Для фахівця: DDNS оновлює DNS, але не TURN. Після зміни IP оновіть TURN_EXTERNAL_IP у локальній конфігурації та повторіть установлення; поточні дзвінки можуть перерватися. За CGNAT або другого роутера замовте у провайдера публічний IPv4 або використайте VPS чи відповідний тунель.
sh.technical.router=Для фахівця: закріпіть LAN-адресу в LAN / DHCP reservation. У Port forwarding / Virtual server / NAT задайте однакові зовнішні й внутрішні порти з таблиці. Не вмикайте DMZ і не відкривайте 5432, 6379, 9000, 9001, 8080, 8081, 7880. HTTP health не перевіряє UDP і push. Для власного домену A-запис має вказувати на публічний IPv4.
sh.technical.ports=Інсталятор використовує фіксовані порти й не вибирає вільні автоматично. Зупиніть програму, яка їх займає, та перевірте знову. Якщо порти належать Docker, перевірте назву контейнера. Зупинка іншого сервера перерве його роботу.
sh.technical.restore=Для фахівця: відновлення потребує нового Docker Engine без томів unyri-selfhost і конфігурації з копії в папці випуску. Наявні томи не видаляються. Дотримуйтеся інструкції перенесення на інший комп’ютер.
sh.technical.fallback=Для фахівця: якщо сервер або телефон не підтримує код власника, зареєструйте обліковий запис на цьому сервері. Виконайте команду нижче з папки випуску, замінивши USERNAME на логін цього облікового запису.
sh.technical.trial=Локальна проба: лише localhost; TCP 18080/18443, TCP+UDP 13478, UDP 59152–59200. Кімнати, зміни брандмауера та роутера вимкнено. Зовнішня перевірка повертає exit code 3.
