sh.portPurpose=Для чого / що не працює без нього
sh.port.0=Сертифікат та HTTP → HTTPS; видача сертифіката може не пройти.
sh.port.1=Повідомлення, файли, WebSocket, адмінка; телефони не підключаться.
sh.port.2=STUN/TURN; частина дзвінків не з’єднається.
sh.port.3=Запасне підключення до TURN; relay все одно потребує UDP.
sh.port.4=Медіа relay; дзвінки без звуку/відео чи обриваються.
sh.port.5=Лише кімнати: запасний TCP-шлях медіа.
sh.port.6=Лише кімнати: основний UDP-шлях медіа.
sh.noInternalPorts=Не відкривайте 5432, 6379, 9000, 9001, 8080, 8081, 7880. Не вмикайте DMZ. HTTP health не перевіряє UDP чи push.
sh.routerHelp=Відкрийте адресу роутера в браузері. Логін є на наклейці або заданий вами; пароль не вводьте в UNYRI. У LAN / DHCP reservation закріпіть LAN-адресу ПК. У Port forwarding / Віртуальний сервер / NAT додайте рядки таблиці на цю адресу з однаковими зовнішніми й внутрішніми портами. Збережіть та перевірте з мобільного інтернету.
sh.firewallHint=Один запит Windows UAC дозволить порти таблиці, включно з кімнатами. Можна відмовитися та налаштувати вручну.
