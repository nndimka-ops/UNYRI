sh.firewall.failed=Не вдалося додати правила. Налаштуйте вручну або повторіть.
sh.firewallFailed=Windows відхилила зміну або перевірка правил не пройшла. Встановлення можна продовжити.
sh.manualFirewall=Продовжити з ручним налаштуванням firewall
sh.roomsOnly=Лише якщо ввімкнено кімнати
sh.upnpConsent=Дозволяю спробу UPnP на домашньому роутері. Перевірте правила в роутері; вони можуть зникнути після перезавантаження.
sh.upnp=Спробувати UPnP
sh.upnpRequested=UPnP-запити виконано. Перевірте результат у роутері; це не доводить зовнішню доступність.
sh.upnpFailed=UPnP недоступний або є конфлікт. Використовуйте ручну переадресацію.
sh.rooms=Увімкнути кімнати
sh.inviteOnly=Після отримання прав увімкнути запрошення
sh.inviteHint=Під час встановлення реєстрація відкрита для першого облікового запису. Зареєструйтеся, отримайте права власника за приватним кодом, потім у веб-панелі увімкніть реєстрацію за запрошеннями (SH-2 POST /admin/registration) і створіть запрошення. Прапорець є нагадуванням і не змінює політику сервера.
sh.openHint=Кожен, хто знає адресу, зможе зареєструватися. Режим можна змінити в адмінці після призначення власника.
sh.sourceWarning=Компіляція може тривати десятки хвилин та потребувати кілька ГБ пам’яті й багато місця. Потрібен повний перевірений випуск вихідного коду.
sh.sourceConsent=Погоджуюся на збірку з перевіреного вихідного коду
sh.imageReady=Знайдено метадані SH-5. Спільний інсталятор завантажує опубліковані образи.
sh.installConsent=Кнопка запускає перевірені локальні сценарії, завантажує образи й залежності, створює приватну конфігурацію та Docker-томи. Тримайте застосунок відкритим до завершення. Секрети конфігурації не відображаються.
sh.install=Установити сервер
sh.retry=Повторити встановлення
sh.log=Показати / приховати журнал етапів
sh.ready=Локальний сервер готовий, публічний HTTPS health пройшов.
sh.publicFailed=Локальний сервер готовий, публічний HTTPS не підтверджено. Перевірте DNS, сертифікат та переадресацію. Перевірте телефон із мобільним інтернетом: роутер може не підтримувати NAT loopback.
sh.failed=Дію не завершено. Перевірте вибраний випуск, локальний Docker, доступ до файлів, вільне місце та мережу. Дані збережено; вивід команд приховано для захисту секретів.
sh.phone=Відкрийте UNYRI на телефоні → Сервер → ввести адресу або сканувати QR, зареєструйтеся → ввести код власника або сканувати. QR вище містить лише адресу; підтримка коду залежить від версії клієнта.
sh.phoneChecks=Перевірте два телефони в різних мережах: вхід, повідомлення, фото та дзвінок. Health не доводить роботу UDP та push; фонові push офіційних клієнтів потребують окремого relay.
sh.revealCode=Показати приватні одноразові коди
sh.ownerCode=Одноразовий код власника. Не пересилайте й не публікуйте.
sh.noCode=Коду немає: власника вже призначено або сервер не підтримує SH-2. Для старої версії використайте резервну команду нижче.
sh.fallback=Якщо версія сервера/телефона не підтримує код, зареєструйтеся на цьому сервері та виконайте з папки випуску (USERNAME — ваш нік):
