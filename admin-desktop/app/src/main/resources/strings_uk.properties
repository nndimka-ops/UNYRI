error.SERVER=Не вдалося виконати дію. Перевірте сервер і повторіть вручну.

# Local self-hosting wizard (SH-4)
sh.home=На головну
sh.homeHint=У вас уже є сервер? Підключіться до нього. Щоб створити свій, виберіть «Створити сервер на цьому комп’ютері». Комп’ютер має залишатися ввімкненим, поки люди користуються сервером.
sh.connect=Підключитися до сервера
sh.create=Створити сервер на цьому комп’ютері
sh.myServer=Мій сервер
sh.why=Навіщо:
sh.step.docker=Підготуйте комп’ютер
sh.step.name=Виберіть адресу та назву
sh.step.internet=Перевірте підключення до інтернету
sh.step.ports=Дозвольте підключення до сервера
sh.step.options=Хто зможе користуватися
sh.step.install=Установіть сервер
sh.step.finish=Підключіть телефони
sh.explain.docker=Спочатку підготуємо комп’ютер для сервера. Установіть потрібну програму, натисніть «Перевірити знову» та виберіть папку з розпакованим комплектом UNYRI. Сама перевірка триватиме кілька секунд.
sh.why.docker=Ця програма потрібна, щоб сервер працював на вашому комп’ютері.
sh.explain.name=Придумайте зрозумілу назву й виберіть постійну адресу сервера, наприклад family.duckdns.org. Введіть лише адресу без https:// і додаткових частин після імені. Якщо своєї адреси немає, виберіть безкоштовне ім’я DuckDNS. Налаштування може тривати кілька хвилин.
sh.why.name=За цією адресою ви та ваші близькі підключатиметеся до сервера.
sh.explain.internet=Знайдемо домашню адресу комп’ютера й адресу вашого підключення в інтернеті. Натисніть «Визначити адресу в інтернеті» або введіть її самостійно. Перевірка зазвичай триває кілька секунд. Для порівняння можна вказати адресу з налаштувань роутера.
sh.why.internet=Це допоможе з’ясувати, чи зможуть телефони підключатися до вас поза домашнім Wi-Fi.
sh.explain.ports=Спочатку натисніть «Перевірити підключення на комп’ютері»: перевірка триватиме кілька секунд. Якщо потрібні канали зв’язку вільні, дозвольте їх у захисті комп’ютера й налаштуйте роутер за підказкою нижче. На ручне налаштування знадобиться кілька хвилин.
sh.why.ports=Роутеру потрібно знати, на який комп’ютер спрямовувати повідомлення та дзвінки.
sh.explain.options=Вирішіть, чи зможе зареєструватися кожен, хто знає адресу сервера, чи лише запрошені. Зараз це нагадування: вибраний режим потрібно буде ввімкнути після створення першого облікового запису. Цей крок займе менше хвилини.
sh.why.options=Запрошення допоможуть залишити сервер лише для своїх.
sh.explain.install=Натисніть «Установити сервер» і залиште програму відкритою. Вона завантажить усе потрібне, запустить сервер і перевірить підключення. Це може тривати кілька хвилин; перше завантаження іноді займає більше часу.
sh.why.install=Після встановлення ви побачите, що вже працює і що ще треба налаштувати.
sh.explain.finish=Відкрийте UNYRI на телефоні, підключіться за адресою нижче та створіть свій обліковий запис. Потім введіть особистий код власника. Зазвичай це займає кілька хвилин.
sh.why.finish=Код власника дасть вам змогу керувати сервером і запрошувати людей.
sh.dockerWindows=Docker Desktop — програма, усередині якої працює сервер. Установіть її з офіційної сторінки, потім перезавантажте комп’ютер, відкрийте Docker Desktop і натисніть «Перевірити знову».
sh.dockerLinux=Для роботи сервера потрібна програма Docker. Відкрийте офіційну інструкцію встановлення. Після встановлення запустіть її та натисніть «Перевірити знову». Якщо потрібна допомога зі встановленням, відкрийте «Докладніше».
sh.dockerMissing=Програма для роботи сервера ще не готова. Установіть або відкрийте Docker Desktop. Після встановлення перезавантажте комп’ютер і натисніть «Перевірити знову». Відомості для помічника — у розділі «Докладніше».
sh.dockerReady=Комп’ютер готовий до встановлення сервера. Виберіть папку комплекту UNYRI та натисніть «Далі».
sh.downloadDocker=Завантажити з офіційного сайту
sh.checkAgain=Перевірити знову
sh.bundleHint=Розпакуйте завантажений комплект сервера UNYRI в окрему папку. Натисніть «Вибрати папку комплекту» та вкажіть її. На цьому комп’ютері майстер керує одним сервером.
sh.chooseBundle=Вибрати папку комплекту
sh.domain=У мене вже є адреса сервера
sh.duck=Безкоштовне ім’я DuckDNS
sh.dnsName=Постійна адреса, наприклад family.duckdns.org
sh.duckHint=Відкрийте інструкцію DuckDNS, створіть безкоштовне ім’я та скопіюйте звідти особистий ключ. Вставте його нижче й збережіть. Він зберігатиметься лише на цьому комп’ютері в захищеному файлі. Якщо адреса підключення зміниться, оновіть ім’я за інструкцією DuckDNS.
sh.duckSetup=Відкрити інструкцію DuckDNS
sh.duckToken=Особистий ключ DuckDNS (приховано)
sh.saveToken=Зберегти в захищений файл
sh.tokenSaved=Ключ збережено на цьому комп’ютері. Поле очищено для безпеки.
sh.duckConsent=Дозволяю надіслати особистий ключ, ім’я сервера й адресу підключення сервісу DuckDNS, щоб оновити адресу сервера.
sh.updateDdns=Оновити ім’я DuckDNS
sh.ddnsUpdated=Запит прийнято. Нове значення адреси може з’явитися не одразу. Якщо підключитися не вдається, зачекайте й перевірте знову.
sh.unyriSoon=Безкоштовне ім’я UNYRI — згодом
sh.lan=Адреса комп’ютера в домашній мережі
sh.router=Адреса роутера
sh.wan=Адреса підключення з налаштувань роутера (необов’язково)
sh.publicIp=Адреса підключення в інтернеті, наприклад 203.0.113.10
sh.unknown=Не перевірено
sh.ipConsent=Дозволяю визначити адресу мого підключення через api.ipify.org. Цей сайт побачить адресу мого підключення.
sh.detectIp=Визначити адресу в інтернеті
sh.cgnat=Підключення з інтернету може бути недоступне: роутер показує іншу адресу. Запитайте інтернет-провайдера, чи можна підключатися до вашого комп’ютера ззовні та чи потрібна для цього окрема адреса. Якщо потрібна допомога, відкрийте «Докладніше».
sh.dynamicIp=Якщо провайдер змінить адресу підключення, може знадобитися оновити налаштування сервера, щоб дзвінки знову працювали. Інструкція для помічника — у розділі «Докладніше».
sh.port=Канал зв’язку (порт)
sh.protocol=Тип зв’язку
sh.portPurpose=Для чого потрібен
sh.port.0=Безпечне підключення: без нього не вдасться підтвердити адресу сервера.
sh.port.1=Повідомлення, файли та керування сервером: без нього телефони не підключаться.
sh.port.2=З’єднання дзвінків: поки порт зайнятий, дзвінки не зможуть працювати.
sh.port.3=Запасний спосіб з’єднання дзвінків; інші канали дзвінків також потрібні.
sh.port.4=Звук і відео: поки ці порти зайняті, дзвінки не зможуть працювати.
sh.port.5=Лише для кімнат: запасний канал звуку та відео.
sh.port.6=Лише для кімнат: основний канал звуку та відео.
sh.noInternalPorts=Дозволяйте лише канали зі списку. Після перевірки сервера також перевірте дзвінок і повідомлення між двома телефонами.
sh.routerHelp=Відкрийте адресу роутера в браузері й увійдіть у його налаштування. Не вводьте пароль роутера в UNYRI. Закріпіть за комп’ютером його домашню адресу. Знайдіть «Переадресація портів» або «Віртуальний сервер» і спрямуйте канали зі списку на цей комп’ютер. Підказки для помічника — у розділі «Докладніше». Після збереження перевірте телефон із вимкненим Wi-Fi.
sh.firewallHint=Наступна кнопка попросить Windows дозволити підключення до сервера. Підтвердьте запит Windows. Це триватиме кілька секунд. Можна вибрати ручне налаштування.
sh.firewall=Дозволити підключення у Windows
sh.firewall.pending=Дозвіл на підключення на комп’ютері ще не налаштовано.
sh.firewall.applied=Windows дозволила підключення до сервера.
sh.firewall.skipped=Ви вибрали ручне налаштування захисту комп’ютера.
sh.firewall.failed=Не вдалося дозволити підключення. Спробуйте знову або налаштуйте захист комп’ютера вручну.
sh.firewallFailed=Windows не підтвердила дозвіл на підключення. Установлення можна продовжити, але до ручного налаштування телефони можуть не підключатися.
sh.manualFirewall=Я налаштую захист комп’ютера вручну
sh.roomsOnly=Лише якщо ввімкнено кімнати
sh.upnpConsent=Дозволяю програмі спробувати налаштувати роутер автоматично. Після цього я перевірю результат у налаштуваннях роутера. Після його перезавантаження налаштування може знадобитися повторити.
sh.upnp=Спробувати налаштувати роутер автоматично
sh.upnpRequested=Запити роутеру надіслано. Перевірте його налаштування та підключення телефона з вимкненим Wi-Fi: роутер міг не застосувати зміни.
sh.upnpFailed=Автоматично налаштувати роутер не вдалося. Налаштуйте його вручну за підказкою вище.
sh.rooms=Дозволити групові дзвінки в кімнатах
sh.inviteOnly=Нагадати ввімкнути реєстрацію лише за запрошеннями
sh.inviteHint=Спочатку реєстрація відкрита, щоб ви створили свій обліковий запис. Отримайте права власника за особистим кодом, відкрийте керування сервером у браузері й увімкніть реєстрацію лише за запрошеннями. Там само створіть запрошення. Ця позначка лише нагадує про це й сама не змінює налаштувань.
sh.openHint=Зареєструватися зможе кожен, хто знає адресу сервера. Отримавши права власника, ви зможете змінити це в керуванні сервером.
sh.sourceWarning=Готовий до встановлення комплект не знайдено або звичайне встановлення не вдалося. Можна підготувати сервер із повного комплекту вихідних файлів. Це може тривати десятки хвилин і потребувати багато вільної пам’яті та місця. Якщо не впевнені, попросіть помічника перевірити комплект.
sh.sourceConsent=Дозволяю тривалу підготовку сервера з перевірених файлів
sh.imageReady=Готовий до встановлення комплект знайдено. Під час установлення програма завантажить потрібні частини сервера.
sh.installConsent=Установлення завантажить потрібні файли й створить місце для даних сервера на цьому комп’ютері. Не закривайте програму до завершення. Особисті ключі та паролі на екрані не показуються.
sh.install=Установити сервер
sh.retry=Повторити встановлення
sh.log=Докладніше про етапи
sh.ready=Сервер працює на цьому комп’ютері. Підключення за адресою в інтернеті також перевірено. Тепер підключіть телефони.
sh.publicFailed=Сервер працює на цьому комп’ютері, але підключення з інтернету поки не підтверджено. Перевірте постійну адресу й налаштування роутера. Потім спробуйте підключити телефон із вимкненим Wi-Fi.
sh.failed=Дію не завершено. Перевірте, чи запущено програму для роботи сервера, чи вибрано потрібний комплект, чи є вільне місце та чи працює інтернет. Дані збережено. Якщо потрібна допомога, відкрийте «Докладніше».
sh.phone=На телефоні відкрийте UNYRI → «Сервер». Введіть показану адресу або відскануйте квадратний код. Створіть обліковий запис, потім виберіть «Стати власником» і введіть код власника. Квадратний код вище містить лише адресу сервера. Якщо кнопки немає, оновіть UNYRI.
sh.phoneChecks=На двох телефонах у різних мережах перевірте вхід, повідомлення, фото та дзвінок. Окремо перевірте сповіщення, коли застосунок закрито: для власного сервера вони потребують додаткового налаштування.
sh.revealCode=Показати особистий код власника
sh.ownerCode=Одноразовий код власника. Не пересилайте й не публікуйте.
sh.noCode=Код не знайдено. Можливо, права власника вже отримано або сервер потрібно оновити. Для старої версії попросіть помічника відкрити «Докладніше».
sh.fallback=Якщо отримати права власника за кодом не вдається, оновіть UNYRI або попросіть помічника відкрити «Докладніше».
sh.health=Робота сервера на цьому комп’ютері
sh.version=Версія сервера
sh.selfCheck=Перевірити налаштування сервера
sh.selfCheckHint=Для перевірки увійдіть адміністратором саме на цей сервер. Кнопка перевіряє збережені налаштування; дзвінки та сповіщення перевірте окремо на телефонах. Керування запрошеннями відкриється в браузері.
sh.signInLocal=Спочатку увійдіть адміністратором саме на цей сервер.
sh.invites=Керувати запрошеннями в браузері
sh.check.public=Адресу для підключення з інтернету вказано
sh.check.turn=Допомогу зі з’єднанням дзвінків налаштовано
sh.check.storage=Місце для файлів налаштовано
sh.check.rooms=Кімнати налаштовано
sh.check.push=Сповіщення на телефонах налаштовано
sh.action.start=Запустити
sh.action.stop=Зупинити
sh.action.update=Оновити
sh.action.backup=Резервна копія
sh.action.restore=Відновити
sh.action.delete=Видалити сервер
sh.confirm.start=Запустити сервер на цьому комп’ютері? Після запуску люди знову зможуть підключатися. Це може тривати кілька хвилин.
sh.confirm.stop=Зупинити сервер? Повідомлення та дзвінки будуть недоступні до запуску. Дані збережуться.
sh.confirm.update=Спочатку буде створено резервну копію, потім сервер оновиться з вибраного комплекту. На цей час повідомлення та дзвінки стануть недоступні. Оновлення може тривати кілька хвилин. Якщо потрібен новий випуск, спочатку попросіть помічника підготувати комплект.
sh.confirm.backup=Сервер ненадовго зупиниться. Копіювання може тривати кілька хвилин, а якщо файлів багато — довше. Копія містить особисті дані та ключі. Після завершення перенесіть її на окремий захищений диск. Де її знайти — у розділі «Докладніше».
sh.confirm.restore=Відновлення призначене для нового комп’ютера без установленого сервера. Потрібні повна резервна копія та її налаштування. Цей крок не видаляє наявний сервер. Час залежить від розміру копії. Перш ніж продовжити, попросіть помічника звіритися з інструкцією в розділі «Докладніше».
sh.confirm.delete=Спочатку буде створено й перевірено резервну копію. Потім сервер і його робочі дані буде видалено із цього комп’ютера. Люди більше не зможуть до нього підключатися. Це може тривати кілька хвилин. Після цього видаліть налаштування підключення до нього в роутері.
sh.typeDomain=Для підтвердження введіть постійну адресу сервера:
sh.eraseBackup=Видалити й резервну копію (усі копії цього сервера на цьому ПК)
sh.confirm=Підтвердити
sh.done=Дію завершено. Оновіть статус вручну.
sh.phase.prepare=Підготовка
sh.phase.pull=Завантажуємо частини сервера
sh.phase.build=Готуємо сервер з вихідних файлів; це може тривати десятки хвилин
sh.phase.start=Запускаємо сервер
sh.phase.health=Перевіряємо роботу на цьому комп’ютері
sh.phase.policy=Налаштування реєстрації
sh.phase.public=Перевіряємо підключення з інтернету
sh.phase.ready=Сервер готовий на цьому комп’ютері
sh.phase.backup=Резервна копія
sh.phase.restore=Відновлення
sh.phase.stop=Зупинка
sh.phase.delete=Видалення

sh.restoring=Відновлюємо дані з копії. Це може тривати кілька хвилин або довше, якщо файлів багато. Якщо з’явиться помилка, збережіть копію та всі відновлені файли для помічника.

sh.bundleInvalid=Ця папка не підходить. Завантажте повний комплект сервера UNYRI, розпакуйте його в окрему папку й виберіть її. Подробиці для помічника — у розділі «Докладніше».

sh.serverName=Назва сервера в застосунках

sh.portsReady=Потрібні канали зв’язку на комп’ютері вільні. Тепер перевірте налаштування захисту комп’ютера та роутера.

sh.portsBusy=Потрібний канал зв’язку зайнятий іншою програмою або його не вдалося перевірити. Поки канали дзвінків зайняті, дзвінки не зможуть працювати. Знайдіть назву програми нижче, зупиніть її, якщо вона вам зараз не потрібна, і натисніть «Перевірити підключення на комп’ютері». Майстер не вибирає інші порти.

sh.checkPorts=Перевірити підключення на комп’ютері

sh.trialHint=Пробний сервер доступний лише на цьому комп’ютері. Телефони до нього не підключаться. Перевірка не змінює захист комп’ютера та налаштування роутера. Для сервера для родини потрібне звичайне встановлення.

# Connection doctor phase 1b (shared iOS English keys)
