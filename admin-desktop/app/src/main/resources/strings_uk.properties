The\ home\ address\ may\ have\ changed.\ Update\ it\ in\ the\ PC\ app.=Домашня адреса могла змінитися. Оновіть її в програмі на комп’ютері.
The\ home\ address\ was\ found.\ Secure\ home\ access\ is\ not\ configured\ yet.=Домашню адресу знайдено. Безпечне підключення вдома ще не налаштовано.
Home\ address\ not\ found.\ Connect\ the\ PC\ to\ your\ router\ and\ check\ again.=Домашню адресу не знайдено. Підключіть комп’ютер до роутера й повторіть перевірку.
This\ is\ your\ server\ on\ a\ PC.\ The\ PC\ must\ stay\ on.=Це ваш сервер на ПК. Комп’ютер має залишатися увімкненим.
