Room\ ports\:\ 17881\ TCP;\ 17882\ UDP.=Порти кімнат: 17881 TCP; 17882 UDP.
Rooms\ are\ disabled\ on\ this\ server.=Кімнати на цьому сервері вимкнено.
Messages\ work\ through\ this\ tunnel.\ Calls\ may\ fail\ to\ connect.=Через цей тунель повідомлення працюють. Дзвінки можуть не з’єднуватися.
This\ server\ is\ in\ a\ data\ centre.\ There\ is\ no\ home\ address\ for\ phones.=Це сервер у дата-центрі. Домашньої адреси для телефонів немає.
