sh.selfCheckHint=Для self-check увійдіть адміністратором саме на цей сервер. Це перевірка конфігурації, а не зовнішніх UDP-портів. Запрошення доступні у вебадмінці після захищеного входу.
sh.signInLocal=Спочатку увійдіть адміністратором саме на цей сервер.
