sh.technical.dockerWindows=Для специалиста: Docker Desktop, локальный Linux Engine, WSL 2 backend, Linux containers, Compose 2.24+. Удалённые Docker contexts не поддерживаются.
sh.technical.dockerLinux=Для специалиста: Docker Engine, Compose plugin 2.24+, Bash, curl и openssl. Учётной записи нужен доступ к локальному Engine; удалённые contexts не поддерживаются.
sh.technical.bundle=Для специалиста: нужен отдельный распакованный выпуск SH-5 с scripts/selfhost/install.ps1 или install.sh и docker-compose.selfhost.yml. Рабочие каталоги Git не принимаются. Один сервер на локальный Docker Engine.
sh.technical.dynamicIp=Для специалиста: DDNS обновляет DNS, но не TURN. После смены IP обновите TURN_EXTERNAL_IP в локальной конфигурации и повторите установку; текущие звонки могут прерваться. При CGNAT или втором роутере запросите у провайдера публичный IPv4 либо используйте VPS или подходящий туннель.
sh.technical.router=Для специалиста: закрепите LAN-адрес в LAN / DHCP reservation. В Port forwarding / Virtual server / NAT задайте одинаковые внешние и внутренние порты из таблицы. Не включайте DMZ и не открывайте 5432, 6379, 9000, 9001, 8080, 8081, 7880. HTTP health не проверяет UDP и push. Свой домен: A-запись должна указывать на публичный IPv4.
sh.technical.ports=Установщик использует фиксированные порты и не выбирает свободные автоматически. Остановите программу-владельца и повторите проверку. Если владельцем является Docker, проверьте имя контейнера. Остановка чужого сервера прервёт его работу.
sh.technical.restore=Для специалиста: восстановление требует новый Docker Engine без томов unyri-selfhost и конфигурацию из копии в папке выпуска. Существующие тома не удаляются. Следуйте инструкции переноса на другой компьютер.
sh.technical.fallback=Для специалиста: если сервер или телефон не поддерживает код владельца, зарегистрируйте аккаунт на этом сервере. Выполните команду ниже из папки выпуска, заменив USERNAME на логин этого аккаунта.
sh.technical.trial=Локальная проба: только localhost; TCP 18080/18443, TCP+UDP 13478, UDP 59152–59200. Комнаты, изменения брандмауэра и роутера отключены. Проверка извне возвращает exit code 3.
