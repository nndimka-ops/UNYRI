sh.technical.backup=Для специалиста: готовая резервная копия находится в selfhost-backups, в папке с отметкой COMPLETE. Она содержит личные данные и секреты. Перенесите завершённую копию на отдельный защищённый диск.
sh.technical.update=Для специалиста: для нового выпуска сначала подготовьте в этой папке проверенные исходники или закреплённый digest, сохранив приватную конфигурацию. Обновление создаёт резервную копию и может кратковременно остановить сервер.
