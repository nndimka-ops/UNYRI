sh.confirm.start=Запустить сервер на этом компьютере? После запуска люди снова смогут подключаться. Это может занять несколько минут.
sh.confirm.stop=Остановить сервер? Сообщения и звонки будут недоступны до запуска. Данные сохранятся.
sh.confirm.update=Сначала будет создана резервная копия, затем сервер обновится из выбранного комплекта. На это время сообщения и звонки станут недоступны. Обновление может занять несколько минут. Если нужен новый выпуск, сначала попросите помощника подготовить комплект.
sh.confirm.backup=Сервер ненадолго остановится. Копирование может занять несколько минут, а при большом количестве файлов — дольше. Копия содержит личные данные и ключи. После завершения перенесите её на отдельный защищённый диск. Где её найти — в разделе «Подробнее».
sh.confirm.restore=Восстановление предназначено для нового компьютера без установленного сервера. Нужны полная резервная копия и её настройки. Этот шаг не удаляет существующий сервер. Время зависит от размера копии. Перед продолжением попросите помощника свериться с инструкцией в разделе «Подробнее».
sh.confirm.delete=Сначала будет создана и проверена резервная копия. Затем сервер и его рабочие данные будут удалены с этого компьютера. Люди больше не смогут к нему подключаться. Это может занять несколько минут. После этого удалите настройки подключения к нему в роутере.
sh.typeDomain=Для подтверждения введите постоянный адрес сервера:
sh.eraseBackup=Удалить и резервную копию (все копии этого сервера на этом ПК)
sh.confirm=Подтвердить
sh.done=Действие завершено. Обновите статус вручную.
