sh.action.delete=Удалить сервер
sh.confirm.start=Запустить контейнеры этого домашнего сервера?
sh.confirm.stop=Остановить сервер? Сообщения и звонки будут недоступны до запуска. Данные сохранятся.
sh.confirm.update=Создать резервную копию и обновить образы из выбранного проверенного выпуска? Сервер временно остановится. Для нового выпуска сначала замените исходники/закреплённый digest в этой папке, сохранив приватную конфигурацию.
sh.confirm.backup=Сервер временно остановится. Копия в selfhost-backups содержит личные данные и секреты: перенесите завершённую папку COMPLETE на защищённый отдельный диск.
sh.confirm.restore=Общий скрипт восстановления требует новый Docker Engine без томов unyri-selfhost и конфигурацию из копии в папке выпуска. Существующие тома не удаляются. Следуйте инструкции переноса на другой компьютер.
sh.confirm.delete=Будет создана проверенная резервная копия, затем удалены контейнеры, тома и приватная конфигурация этого сервера. Удалите также свои правила проброса на роутере. Исходники выпуска сохранятся.
sh.typeDomain=Для подтверждения введите имя сервера:
sh.eraseBackup=Удалить и резервную копию (все копии этого сервера на этом ПК)
sh.confirm=Подтвердить
sh.done=Действие завершено. Обновите статус вручную.
