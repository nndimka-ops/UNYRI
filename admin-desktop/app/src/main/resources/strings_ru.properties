sh.explain.docker=Docker запускает части сервера в отдельных контейнерах. Установите его вручную и выберите распакованный проверенный выпуск UNYRI.
sh.why.docker=Так сервер одинаково работает на Windows и Linux.
sh.explain.name=Телефоны будут подключаться по постоянному DNS-имени без https:// и пути. Настройте A-запись на свой публичный IPv4.
sh.why.name=Имя нужно для HTTPS-сертификата и сохраняется в аккаунтах.
sh.explain.internet=Локальный адрес нужен для проброса портов. WAN-адрес посмотрите в разделе Интернет на роутере; мастер не входит в роутер.
sh.why.internet=Без доступного извне IPv4 телефоны вне домашнего Wi-Fi не смогут подключиться.
sh.explain.ports=Разрешите только перечисленные порты на ПК и перенаправьте их с роутера на LAN-адрес ПК.
sh.why.ports=Роутер должен знать, какому компьютеру передавать сообщения и звонки.
sh.explain.options=Выберите комнаты и способ регистрации. Личные звонки работают и без комнат.
sh.why.options=Приглашения ограничивают регистрацию, комнаты требуют дополнительных ресурсов и портов.
sh.explain.install=Мастер запустит установщик из выбранного выпуска и дождётся локальной готовности, затем проверит публичный HTTPS.
sh.why.install=Проверки помогают отличить ошибку установки от проблем DNS или роутера.
sh.explain.finish=Сохраните адрес и назначьте владельца на своём телефоне.
sh.why.finish=Одноразовый код даёт вашему аккаунту права владельца.
sh.dockerWindows=Нужен Docker Desktop с работающим WSL 2 backend и Linux containers, Compose 2.24+. Установка может потребовать перезагрузку.
sh.dockerLinux=Нужны Docker Engine и Compose plugin 2.24+, Bash, curl и openssl. Дайте своей учётной записи доступ к локальному Engine.
sh.dockerMissing=Docker не готов. Запустите локальный Linux Engine / WSL 2 и проверьте Compose. Удалённые Docker contexts запрещены.
sh.dockerReady=Локальный Docker и Compose готовы.
sh.downloadDocker=Официальная установка Docker
sh.checkAgain=Проверить снова
sh.bundleHint=Выберите отдельную проверенную сборку SH-5 с scripts/selfhost/install и docker-compose.selfhost.yml. Один домашний сервер на Docker Engine.
sh.chooseBundle=Выбрать папку выпуска
sh.domain=Свой домен
sh.duck=Бесплатное имя DuckDNS
sh.dnsName=DNS-имя, например family.duckdns.org
sh.duckHint=Создайте имя на DuckDNS. Токен будет сохранён только в защищённом локальном файле. Обновление имени здесь ручное; для постоянной работы настройте updater по инструкции сервиса.
sh.duckSetup=Открыть инструкцию DuckDNS
sh.duckToken=Токен DuckDNS (скрыт)
sh.saveToken=Сохранить в защищённый файл
sh.tokenSaved=Токен сохранён локально; поле очищено.
sh.duckConsent=Разрешаю отправить токен, имя и этот IPv4 сервису DuckDNS для обновления DNS.
sh.updateDdns=Обновить имя DuckDNS
sh.ddnsUpdated=Запрос обновления DuckDNS принят. Дождитесь обновления DNS.
sh.unyriSoon=UNYRI name — скоро
sh.lan=LAN-адрес ПК
sh.router=Адрес роутера
sh.wan=WAN IPv4 из настроек роутера (необязательно)
sh.publicIp=Публичный IPv4 (можно ввести вручную)
sh.unknown=Не проверено
sh.ipConsent=Разрешаю запрос к api.ipify.org: этот сервис узнает публичный IP моего подключения.
sh.detectIp=Определить публичный IP
sh.cgnat=WAN-адрес частный или отличается от публичного: возможно, это CGNAT или второй роутер. Проброс только на домашнем роутере не поможет — запросите у провайдера публичный IPv4 либо используйте VPS или подходящий туннель.
sh.dynamicIp=DDNS меняет DNS, но не TURN: после смены IP обновите TURN_EXTERNAL_IP локально в файле установщика и повторите установку; активные звонки могут прерваться.
sh.port=Порт
sh.protocol=Протокол
sh.portPurpose=Для чего / что не работает без него
sh.port.0=Сертификат и HTTP → HTTPS; выдача сертификата может не пройти.
sh.port.1=Сообщения, файлы, WebSocket, админка; телефоны не подключатся.
sh.port.2=STUN/TURN; часть звонков не соединится.
sh.port.3=Запасное подключение к TURN; relay всё равно требует UDP.
sh.port.4=Медиа relay; звонки без звука/видео или обрываются.
sh.port.5=Только комнаты: запасной TCP-путь медиа.
sh.port.6=Только комнаты: основной UDP-путь медиа.
sh.noInternalPorts=Не открывайте 5432, 6379, 9000, 9001, 8080, 8081, 7880. Не включайте DMZ. HTTP health не проверяет UDP или push.
sh.routerHelp=Откройте адрес роутера в браузере. Логин указан на наклейке или задан вами; пароль не вводите в UNYRI. В LAN / DHCP reservation закрепите LAN-адрес ПК. В Port forwarding / Виртуальный сервер / NAT добавьте строки таблицы на этот адрес с теми же внешними и внутренними портами. Сохраните и проверьте с мобильного интернета.
sh.firewallHint=Один запрос Windows UAC разрешит порты из таблицы, включая порты комнат. Можно отказаться и настроить вручную.
sh.firewall=Разрешить в Windows Firewall
sh.firewall.pending=Firewall ещё не настроен.
sh.firewall.applied=Правила Windows Firewall добавлены.
sh.firewall.skipped=Firewall настрою вручную.
sh.firewall.failed=Не удалось добавить правила. Настройте вручную или повторите.
sh.firewallFailed=Windows не разрешила изменение или проверка правил не прошла. Установка не заблокирована.
sh.manualFirewall=Продолжить с ручной настройкой firewall
sh.roomsOnly=Только если включены комнаты
sh.upnpConsent=Разрешаю попытку UPnP на домашнем роутере. Проверьте правила в роутере; они могут пропасть после перезагрузки.
sh.upnp=Попробовать UPnP
sh.upnpRequested=UPnP-запросы выполнены. Проверьте результат в роутере; это не доказательство внешней доступности.
sh.upnpFailed=UPnP недоступен или есть конфликт. Используйте ручной проброс.
sh.rooms=Включить комнаты
sh.inviteOnly=После получения прав включить вход по приглашениям
sh.inviteHint=При установке регистрация открыта для первого аккаунта. Зарегистрируйтесь, получите права владельца с личным кодом, затем в веб-панели включите регистрацию по приглашениям (SH-2 POST /admin/registration) и создайте приглашения. Флажок — напоминание, он не меняет настройку сервера.
sh.openHint=Любой, кто знает адрес, сможет зарегистрироваться. Режим можно изменить в админке после назначения владельца.
sh.sourceWarning=Сборка исходников может занять десятки минут, несколько ГБ памяти и много места. Нужен полный проверенный выпуск исходников.
sh.sourceConsent=Согласен на сборку из проверенных исходников
sh.imageReady=Найдены метаданные SH-5. Обычный установщик загружает опубликованные образы.
sh.installConsent=Кнопка запускает проверенные локальные сценарии, скачивает образы и зависимости, создаёт приватную конфигурацию и Docker-тома. Держите приложение открытым до завершения. Секреты конфигурации не отображаются.
sh.install=Установить сервер
sh.retry=Повторить установку
sh.log=Показать / скрыть журнал этапов
sh.ready=Локальный сервер готов, публичный HTTPS health прошёл.
sh.publicFailed=Локальный сервер готов, публичный HTTPS не подтверждён. Проверьте DNS, сертификат и проброс. Проверьте также телефон с мобильным интернетом: роутер может не поддерживать NAT loopback.
sh.failed=Действие не завершено. Проверьте выбранный выпуск, локальный Docker, доступ к файлам, свободное место и сеть. Данные сохранены; вывод команд скрыт, чтобы не раскрыть секреты.
sh.phone=Откройте UNYRI на телефоне → Сервер → ввести адрес или отсканировать QR, зарегистрируйтесь → ввести код владельца или отсканировать. QR выше содержит только адрес; поддержка кода зависит от версии клиента.
sh.phoneChecks=Проверьте два телефона в разных сетях: вход, сообщение, фото и звонок. Health не доказывает работу UDP и push; фоновые push официальных клиентов требуют отдельного relay.
sh.revealCode=Показать приватные одноразовые коды
sh.ownerCode=Одноразовый код владельца. Не пересылайте и не публикуйте.
sh.noCode=Код отсутствует: владелец уже назначен либо сервер не поддерживает SH-2. Для старой версии используйте резервную команду ниже.
sh.fallback=Если версия сервера/телефона не поддерживает код, зарегистрируйтесь на этом сервере и выполните из папки выпуска (USERNAME — ваш ник):
sh.health=Локальный health
sh.version=Образ / версия
sh.selfCheck=Проверить настройки SH-2
sh.selfCheckHint=Для self-check войдите администратором именно на этот сервер. Это проверка конфигурации, а не внешних UDP-портов. Приглашения доступны в веб-админке после защищённого входа.
sh.signInLocal=Сначала войдите администратором именно на этот сервер.
sh.invites=Приглашения → веб-админка
