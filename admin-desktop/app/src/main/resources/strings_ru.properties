error.RATE_LIMIT=Слишком много запросов. Повторите позже.
error.PROTOCOL=Сервер прислал ответ, который программа не смогла прочитать. Обновите программу или обратитесь за помощью.
error.STORAGE=Не удалось сохранить вход в защищённом хранилище компьютера. Пока не считайте его сохранённым.
error.INVALID=Проверьте адрес, заполните обязательные поля и заново сверьте бумажный ключ и подтверждение.
error.SERVER=Не удалось выполнить действие. Проверьте сервер и повторите вручную.

# Local self-hosting wizard (SH-4)
sh.home=На главную
sh.homeHint=У вас уже есть сервер? Подключитесь к нему. Чтобы создать свой, выберите «Создать сервер на этом компьютере». Компьютер должен оставаться включённым, пока люди пользуются сервером.
sh.connect=Подключиться к серверу
sh.create=Создать сервер на этом компьютере
sh.myServer=Мой сервер
sh.why=Зачем:
sh.step.docker=Подготовьте компьютер
sh.step.name=Выберите адрес и имя
sh.step.internet=Проверьте подключение к интернету
sh.step.ports=Разрешите подключение к серверу
sh.step.options=Кто сможет пользоваться
sh.step.install=Установите сервер
sh.step.finish=Подключите телефоны
sh.explain.docker=Сначала подготовим компьютер для сервера. Установите нужную программу, нажмите «Проверить снова» и выберите папку с распакованным комплектом UNYRI. Сама проверка займёт несколько секунд.
sh.why.docker=Эта программа нужна, чтобы сервер работал на вашем компьютере.
sh.explain.name=Придумайте понятное имя и выберите постоянный адрес сервера, например family.duckdns.org. Введите сам адрес без https:// и дополнительных частей после имени. Если своего адреса нет, выберите бесплатное имя DuckDNS. На настройку может уйти несколько минут.
sh.why.name=По этому адресу вы и ваши близкие будете подключаться к серверу.
sh.explain.internet=Найдём адрес компьютера дома и адрес вашего подключения в интернете. Нажмите «Определить адрес в интернете» или введите его вручную. Проверка обычно занимает несколько секунд. Адрес из настроек роутера можно указать для сравнения.
sh.why.internet=Это поможет понять, смогут ли телефоны подключаться к вам вне домашнего Wi-Fi.
sh.explain.ports=Сначала нажмите «Проверить подключение на компьютере»: проверка займёт несколько секунд. Если нужные каналы связи свободны, разрешите их в защите компьютера и настройте роутер по подсказке ниже. На ручную настройку понадобится несколько минут.
sh.why.ports=Роутеру нужно знать, на какой компьютер направлять сообщения и звонки.
sh.explain.options=Решите, сможет ли зарегистрироваться любой человек с адресом сервера или только приглашённые. Сейчас это напоминание: выбранный режим нужно будет включить после создания первого аккаунта. Этот шаг займёт меньше минуты.
sh.why.options=Приглашения помогут оставить сервер только для своих.
sh.explain.install=Нажмите «Установить сервер» и оставьте программу открытой. Она скачает всё необходимое, запустит сервер и проверит подключение. Это может занять несколько минут; первое скачивание иногда длится дольше.
sh.why.install=После установки вы увидите, что уже работает и что ещё нужно настроить.
sh.explain.finish=Откройте UNYRI на телефоне, подключитесь по адресу ниже и создайте свой аккаунт. Затем введите личный код владельца. Обычно это занимает несколько минут.
sh.why.finish=Код владельца позволит вам управлять сервером и приглашать людей.
sh.dockerWindows=Docker Desktop — программа, внутри которой работает сервер. Установите её с официальной страницы, затем перезагрузите компьютер, откройте Docker Desktop и нажмите «Проверить снова».
sh.dockerLinux=Для сервера нужна программа Docker. Откройте официальную инструкцию установки. После установки запустите её и нажмите «Проверить снова». Если нужна помощь с установкой, откройте «Подробнее».
sh.dockerMissing=Программа для работы сервера пока не готова. Установите или откройте Docker Desktop. После установки перезагрузите компьютер и нажмите «Проверить снова». Подробности для помощника — в разделе «Подробнее».
sh.dockerReady=Компьютер готов к установке сервера. Выберите папку комплекта UNYRI и нажмите «Далее».
sh.downloadDocker=Скачать с официального сайта
sh.checkAgain=Проверить снова
sh.bundleHint=Распакуйте скачанный комплект сервера UNYRI в отдельную папку. Нажмите «Выбрать папку комплекта» и укажите её. На этом компьютере мастер управляет одним сервером.
sh.chooseBundle=Выбрать папку комплекта
sh.domain=У меня уже есть адрес сервера
sh.duck=Бесплатное имя DuckDNS
sh.dnsName=Постоянный адрес, например family.duckdns.org
sh.duckHint=Откройте инструкцию DuckDNS, создайте бесплатное имя и скопируйте оттуда личный ключ. Вставьте его ниже и сохраните. Он будет храниться только на этом компьютере в защищённом файле. Если адрес подключения меняется, обновляйте имя по инструкции DuckDNS.
sh.duckSetup=Открыть инструкцию DuckDNS
sh.duckToken=Личный ключ DuckDNS (скрыт)
sh.saveToken=Сохранить в защищённый файл
sh.tokenSaved=Ключ сохранён на этом компьютере. Поле очищено для безопасности.
sh.duckConsent=Разрешаю отправить личный ключ, имя сервера и адрес подключения сервису DuckDNS, чтобы обновить адрес сервера.
sh.updateDdns=Обновить имя DuckDNS
sh.ddnsUpdated=Запрос принят. Новое значение адреса может появиться не сразу. Если подключиться не получается, подождите и проверьте снова.
sh.unyriSoon=Бесплатное имя UNYRI — позже
sh.lan=Адрес компьютера в домашней сети
sh.router=Адрес роутера
sh.wan=Адрес подключения из настроек роутера (необязательно)
sh.publicIp=Адрес подключения в интернете, например 203.0.113.10
sh.unknown=Не проверено
sh.ipConsent=Разрешаю узнать адрес моего подключения через api.ipify.org. Этот сайт увидит адрес моего подключения.
sh.detectIp=Определить адрес в интернете
sh.cgnat=Подключение из интернета может быть недоступно: роутер показывает другой адрес. Уточните у интернет-провайдера, можно ли подключаться к вашему компьютеру извне и нужен ли для этого отдельный адрес. Если нужна помощь, откройте «Подробнее».
sh.dynamicIp=Если провайдер изменит адрес подключения, может потребоваться обновить настройки сервера, чтобы звонки снова работали. Инструкция для помощника — в разделе «Подробнее».
sh.port=Канал связи (порт)
sh.protocol=Тип связи
sh.portPurpose=Для чего нужен
sh.port.0=Безопасное подключение: без него не удастся подтвердить адрес сервера.
sh.port.1=Сообщения, файлы и управление сервером: без него телефоны не подключатся.
sh.port.2=Соединение звонков: пока порт занят, звонки не смогут работать.
sh.port.3=Запасной способ соединения звонков; остальные каналы звонков тоже нужны.
sh.port.4=Звук и видео: пока эти порты заняты, звонки не смогут работать.
sh.port.5=Только для комнат: запасной канал звука и видео.
sh.port.6=Только для комнат: основной канал звука и видео.
sh.noInternalPorts=Разрешайте только каналы из списка. Общую проверку сервера дополните звонком и сообщением между двумя телефонами.
sh.routerHelp=Откройте адрес роутера в браузере и войдите в его настройки. Пароль роутера не вводите в UNYRI. Закрепите за компьютером его домашний адрес. Найдите «Переадресация портов» или «Виртуальный сервер» и направьте каналы из списка на этот компьютер. Подсказки для помощника — в разделе «Подробнее». После сохранения проверьте телефон с выключенным Wi-Fi.
sh.firewallHint=Следующая кнопка попросит Windows разрешить подключения к серверу. Подтвердите запрос Windows. Это займёт несколько секунд. Можно выбрать ручную настройку.
sh.firewall=Разрешить подключения в Windows
sh.firewall.pending=Разрешение подключений на компьютере ещё не настроено.
sh.firewall.applied=Windows разрешила подключения к серверу.
sh.firewall.skipped=Вы выбрали ручную настройку защиты компьютера.
sh.firewall.failed=Не удалось разрешить подключения. Повторите или настройте защиту компьютера вручную.
sh.firewallFailed=Windows не подтвердила разрешение подключений. Можно продолжить установку, но до ручной настройки телефоны могут не подключаться.
sh.manualFirewall=Я настрою защиту компьютера вручную
sh.roomsOnly=Только если включены комнаты
sh.upnpConsent=Разрешаю программе попробовать настроить роутер автоматически. После этого я проверю результат в настройках роутера. После его перезагрузки настройку может понадобиться повторить.
sh.upnp=Попробовать настроить роутер автоматически
sh.upnpRequested=Запросы роутеру отправлены. Проверьте настройки роутера и подключение телефона с выключенным Wi-Fi: роутер мог не применить изменения.
sh.upnpFailed=Автоматически настроить роутер не удалось. Настройте его вручную по подсказке выше.
sh.rooms=Разрешить групповые звонки в комнатах
sh.inviteOnly=Напомнить включить регистрацию по приглашениям
sh.inviteHint=Сначала регистрация открыта, чтобы вы создали свой аккаунт. Получите права владельца с личным кодом, откройте управление сервером в браузере и включите регистрацию по приглашениям. Там же создайте приглашения. Эта галочка только напоминает об этом и сама не меняет настройки.
sh.openHint=Зарегистрироваться сможет любой, кто знает адрес сервера. После получения прав владельца вы сможете изменить это в управлении сервером.
sh.sourceWarning=Готовый комплект не найден или обычная установка не удалась. Можно подготовить сервер из полного комплекта исходных файлов. Это может занять десятки минут и потребовать много свободной памяти и места. Если вы не уверены, попросите помощника проверить комплект.
sh.sourceConsent=Разрешаю долгую подготовку сервера из проверенных файлов
sh.imageReady=Готовый комплект найден. Во время установки программа скачает необходимые части сервера.
sh.installConsent=Установка скачает нужные файлы и создаст место для данных сервера на этом компьютере. Не закрывайте программу до завершения. Личные ключи и пароли на экране не показываются.
sh.install=Установить сервер
sh.retry=Повторить установку
sh.log=Подробнее об этапах
sh.ready=Сервер работает на этом компьютере. Подключение по адресу в интернете тоже проверено. Теперь подключите телефоны.
sh.publicFailed=Сервер работает на этом компьютере, но подключение из интернета пока не подтверждено. Проверьте постоянный адрес и настройки роутера. Затем попробуйте подключить телефон с выключенным Wi-Fi.
sh.failed=Действие не завершено. Проверьте, что программа для работы сервера открыта, выбран нужный комплект, есть свободное место и работает интернет. Данные сохранены. Если нужна помощь, откройте «Подробнее».
sh.phone=На телефоне откройте UNYRI → «Сервер». Введите показанный адрес или отсканируйте квадратный код. Создайте аккаунт, затем выберите «Стать владельцем» и введите код владельца. Квадратный код выше содержит только адрес сервера. Если кнопки нет, обновите UNYRI.
sh.phoneChecks=На двух телефонах в разных сетях проверьте вход, сообщение, фото и звонок. Отдельно проверьте уведомления при закрытом приложении: для своего сервера они требуют дополнительной настройки.
sh.revealCode=Показать личный код владельца
sh.ownerCode=Одноразовый код владельца. Не пересылайте и не публикуйте.
sh.noCode=Код не найден. Возможно, права владельца уже получены или сервер нужно обновить. Для старой версии попросите помощника открыть «Подробнее».
sh.fallback=Если получить права владельца по коду не получается, обновите UNYRI или попросите помощника открыть «Подробнее».
