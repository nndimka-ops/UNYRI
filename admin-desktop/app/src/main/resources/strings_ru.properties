sh.phase.start=Запускаем сервер
sh.phase.health=Проверяем работу на этом компьютере
sh.phase.policy=Настройка регистрации
sh.phase.public=Проверяем подключение из интернета
sh.phase.ready=Сервер готов на этом компьютере
sh.phase.backup=Резервная копия
sh.phase.restore=Восстановление
sh.phase.stop=Остановка
sh.phase.delete=Удаление

sh.restoring=Восстанавливаем данные из копии. Это может занять несколько минут или дольше при большом количестве файлов. Если появится ошибка, сохраните копию и все восстановленные файлы для помощника.

sh.bundleInvalid=Эта папка не подходит. Скачайте полный комплект сервера UNYRI, распакуйте его в отдельную папку и выберите её. Подробности для помощника — в разделе «Подробнее».

sh.serverName=Имя сервера в приложениях

sh.portsReady=Нужные каналы связи на компьютере свободны. Теперь проверьте настройки защиты компьютера и роутера.

sh.portsBusy=Нужный канал связи занят другой программой или его не удалось проверить. Пока каналы звонков заняты, звонки не смогут работать. Посмотрите название программы ниже, остановите её, если она вам сейчас не нужна, и нажмите «Проверить подключение на компьютере». Мастер не выбирает другие порты.

sh.checkPorts=Проверить подключение на компьютере

sh.trialHint=Пробный сервер доступен только на этом компьютере. Телефоны к нему не подключатся. Проверка не меняет защиту компьютера и настройки роутера. Для сервера для семьи понадобится обычная установка.

