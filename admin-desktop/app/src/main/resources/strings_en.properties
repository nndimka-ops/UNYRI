sh.confirm.update=A backup will be created before the server updates from the selected package. Messages and calls will be unavailable during this. Updating may take several minutes. For a new release, first ask a helper to prepare the package.
sh.confirm.backup=The server will stop briefly. Copying may take several minutes, or longer if there are many files. The backup contains private data and keys. After it finishes, move it to a separate protected drive. Find its location under “Details”.
sh.confirm.restore=Restore is for a new computer without an installed server. You need the full backup and its settings. This step does not delete an existing server. The time depends on backup size. Before continuing, ask a helper to check the instructions under “Details”.
sh.confirm.delete=A backup will be created and checked first. Then the server and its working data will be removed from this computer. People will no longer be able to connect. This may take several minutes. Afterwards, remove its connection settings from the router.
