sh.technical.dockerWindows=For a specialist: Docker Desktop, local Linux Engine, WSL 2 backend, Linux containers, Compose 2.24+. Remote Docker contexts are not supported.
sh.technical.dockerLinux=For a specialist: Docker Engine, Compose plugin 2.24+, Bash, curl and openssl. The account needs access to the local Engine; remote contexts are not supported.
sh.technical.bundle=For a specialist: use a separate unpacked SH-5 release with scripts/selfhost/install.ps1 or install.sh and docker-compose.selfhost.yml. Git checkouts are refused. One server per local Docker Engine.
sh.technical.dynamicIp=For a specialist: DDNS updates DNS but not TURN. After an IP change, update TURN_EXTERNAL_IP in the local configuration and rerun installation; active calls may end. For CGNAT or a second router, request a public IPv4 from the provider, or use a VPS or suitable tunnel.
sh.technical.router=For a specialist: reserve the LAN address under LAN / DHCP reservation. Set identical external and internal ports from the table under Port forwarding / Virtual server / NAT. Do not enable DMZ or open 5432, 6379, 9000, 9001, 8080, 8081, 7880. HTTP health does not test UDP or push. For your own domain, point its A record to the public IPv4.
sh.technical.ports=The installer uses fixed ports and cannot choose free ones automatically. Stop the program using them and check again. If Docker owns the ports, check the container name. Stopping another server interrupts its service.
sh.technical.restore=For a specialist: restore requires a fresh Docker Engine without unyri-selfhost volumes and the backup configuration in the release folder. Existing volumes are not deleted. Follow the guide for moving to another computer.
sh.technical.fallback=For a specialist: if the server or phone does not support the owner code, register an account on this server. Run the command below from the release folder, replacing USERNAME with that account’s sign-in username.
sh.technical.trial=Local trial: localhost only; TCP 18080/18443, TCP+UDP 13478, UDP 59152–59200. Rooms, firewall and router changes are disabled. Public verification returns exit code 3.
