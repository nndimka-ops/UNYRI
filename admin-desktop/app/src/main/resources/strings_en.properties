sh.explain.docker=First, prepare the computer to run your server. Install the required program, press “Check again” and choose the folder containing your unpacked UNYRI package. The check itself takes a few seconds.
sh.why.docker=This program lets the server run on your computer.
sh.explain.name=Choose a friendly name and a permanent server address, such as family.duckdns.org. Enter the address itself, without https:// or extra parts after the name. If you do not have an address, choose a free DuckDNS name. Setup may take a few minutes.
sh.why.name=You and the people you invite will use this address to connect.
sh.explain.internet=Find the computer’s home address and your connection’s internet address. Press “Find internet address” or enter it yourself. The check usually takes a few seconds. You may also enter the address from your router settings to compare them.
sh.why.internet=This helps check whether phones can reach your server away from home Wi-Fi.
sh.explain.ports=First press “Check connections on this computer”; the check takes a few seconds. If the required connection channels are free, allow them in the computer’s security settings and follow the router guidance below. Manual setup takes a few minutes.
sh.why.ports=The router needs to know which computer should receive messages and calls.
sh.explain.options=Decide whether anyone with the server address may register or only invited people. This is a reminder: you will need to enable your choice after creating the first account. This step takes less than a minute.
sh.why.options=Invitations help keep the server for people you choose.
sh.explain.install=Press “Install server” and keep this app open. It will download what is needed, start the server and check the connection. This may take several minutes; the first download can take longer.
sh.why.install=After installation, you will see what works and what still needs setup.
sh.explain.finish=Open UNYRI on your phone, connect using the address below and create your account. Then enter your private owner code. This usually takes a few minutes.
sh.why.finish=The owner code lets you manage the server and invite people.
sh.dockerWindows=Docker Desktop is the program your server runs inside. Install it from the official page, then restart the computer, open Docker Desktop and press “Check again”.
sh.dockerLinux=Your server needs Docker to run. Open the official installation guide. After installing, start it and press “Check again”. Open “Details” if you need installation help.
sh.dockerMissing=The program that runs your server is not ready yet. Install or open Docker Desktop. After installing, restart the computer and press “Check again”. Open “Details” for help from a specialist.
sh.dockerReady=The computer is ready to install your server. Choose the UNYRI package folder and press “Next”.
