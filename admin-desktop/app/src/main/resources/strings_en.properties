sh.publicIp=Public IPv4 (you can enter it manually)
sh.unknown=Not checked
sh.ipConsent=Allow a request to api.ipify.org: that service learns this connection’s public IP.
sh.detectIp=Detect public IP
sh.cgnat=WAN is private or differs from the public IP: this may be CGNAT or another router. Forwarding only on the home router will not help — request a public IPv4 from the provider or use a VPS or suitable tunnel.
sh.dynamicIp=DDNS updates DNS but not TURN: after an IP change, update TURN_EXTERNAL_IP locally in the installer configuration and rerun installation; active calls may end.
sh.port=Port
sh.protocol=Protocol
sh.portPurpose=Purpose / what fails if closed
sh.port.0=Certificate and HTTP → HTTPS; certificate issuance may fail.
sh.port.1=Messages, files, WebSocket, admin; phones cannot connect.
sh.port.2=STUN/TURN; some calls cannot connect.
sh.port.3=TURN fallback connection; relay still needs UDP.
sh.port.4=Relay media; calls lose audio/video or drop.
sh.port.5=Rooms only: fallback TCP media path.
sh.port.6=Rooms only: primary UDP media path.
sh.noInternalPorts=Keep 5432, 6379, 9000, 9001, 8080, 8081, 7880 closed. Do not enable DMZ. HTTP health does not test UDP or push.
sh.routerHelp=Open the router address in a browser. Use its sticker or your own login; do not enter its password in UNYRI. Reserve the PC LAN address under LAN / DHCP reservation. Under Port forwarding / Virtual server / NAT, add the table entries to that address with identical external and internal ports. Save and test using mobile data.
sh.firewallHint=One Windows UAC prompt allows the table ports, including rooms. You can decline and configure them manually.
sh.firewall=Allow in Windows Firewall
sh.firewall.pending=Firewall not configured yet.
sh.firewall.applied=Windows Firewall rules added.
sh.firewall.skipped=I will configure the firewall manually.
sh.firewall.failed=Could not add rules. Configure manually or retry.
sh.firewallFailed=Windows declined the change or rule verification failed. Installation can continue.
sh.manualFirewall=Continue with manual firewall setup
sh.roomsOnly=Only with rooms enabled
sh.upnpConsent=Allow an UPnP attempt on the home router. Verify mappings on the router; they may disappear after a restart.
sh.upnp=Try UPnP
sh.upnpRequested=UPnP requests completed. Verify on the router; this does not prove external reachability.
sh.upnpFailed=UPnP unavailable or conflicting. Use manual forwarding.
sh.rooms=Enable rooms
sh.inviteOnly=Plan invite-only after owner claim
sh.inviteHint=Installation keeps registration open for the first account. Register, claim ownership with the private owner code, then open web administration and switch registration to invite-only (SH-2 POST /admin/registration). Create invitations there before sharing the address. This checkbox is a reminder; it does not change server policy.
sh.openHint=Anyone who knows the address can register. Change this in administration after claiming ownership.
sh.sourceWarning=Source compilation can take tens of minutes, several GB of RAM and substantial disk space. Use only a reviewed full source release.
sh.sourceConsent=Allow building the reviewed source release
sh.imageReady=SH-5 release metadata found. The canonical installer pulls published images by default.
sh.installConsent=This runs reviewed local scripts, downloads images and dependencies, and creates private configuration and Docker volumes. Keep the app open until it finishes. Configuration secrets are not displayed.
sh.install=Install server
sh.retry=Retry installation
sh.log=Show / hide progress log
sh.ready=Local server ready; public HTTPS health passed.
sh.publicFailed=Local server ready; public HTTPS not verified. Check DNS, certificates and forwarding. Also test a phone on mobile data: the router may lack NAT loopback.
sh.failed=Action did not finish. Check the selected release, local Docker, file access, free space and network. Data was kept; command output is hidden to protect secrets.
sh.phone=Open UNYRI on your phone → Server → enter the address or scan the QR, register → enter the owner code or scan. The QR above contains only the address; code support depends on the client version.
sh.phoneChecks=Test two phones on different networks: login, message, photo and call. Health does not prove UDP or push delivery; background push in official clients requires a separate relay.
sh.revealCode=Reveal private one-time codes
sh.ownerCode=One-time owner code. Keep private.
sh.noCode=No code: ownership was claimed or the server lacks SH-2 support. For older versions use the fallback command below.
sh.fallback=If server/phone code support is missing, register on this server and run from the release folder (replace USERNAME with your username):
sh.health=Local health
sh.version=Image / version
sh.selfCheck=Check SH-2 configuration
sh.selfCheckHint=For self-check, sign in as admin on this server. This checks configuration, not external UDP ports. Invites are available in web administration after secure sign-in.
sh.signInLocal=First sign in as admin on this server.
sh.invites=Invites → web administration
