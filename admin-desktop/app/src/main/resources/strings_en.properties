sh.confirm.start=Start this home server’s containers?
sh.confirm.stop=Stop the server? Messages and calls are unavailable until restarted. Data is kept.
sh.confirm.update=Back up and update images from the selected reviewed release? The server briefly stops. For a new release, first replace the source/pinned digest in this folder, preserving private configuration.
sh.confirm.backup=The server briefly stops. The selfhost-backups copy contains private data and secrets: move the completed COMPLETE folder to a separate protected disk.
sh.confirm.restore=Canonical restore requires a fresh Docker Engine with no unyri-selfhost volumes and the matching backup configuration in the release folder. It refuses existing volumes and never deletes the current stack. Follow the restore guide for a replacement machine.
sh.confirm.delete=A verified backup is created, then this server’s containers, volumes and private configuration are deleted. Also remove its forwarding rules on the router. Release source files are kept.
sh.typeDomain=To confirm, type the server name:
sh.eraseBackup=Also delete backups (all this server’s backups on this PC)
sh.confirm=Confirm
sh.done=Action completed. Refresh status manually.
