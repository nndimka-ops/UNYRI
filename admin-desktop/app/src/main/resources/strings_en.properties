sh.failed=The action did not finish. Check that the server program is running, the right package is selected, there is free disk space and the internet works. Data was kept. Open “Details” if you need help.
sh.phone=On your phone, open UNYRI → “Server”. Enter the address shown or scan the square code. Create an account, then choose “Become owner” and enter the owner code. The square code above contains only the server address. If the button is missing, update UNYRI.
sh.phoneChecks=Using two phones on different networks, test sign-in, a message, a photo and a call. Also check notifications with the app closed: your own server needs extra setup for these.
