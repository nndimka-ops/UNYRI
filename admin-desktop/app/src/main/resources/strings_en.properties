# Local self-hosting wizard (SH-4)
sh.home=Home
sh.homeHint=Connect to an existing server or create a home server. This computer must stay on.
sh.connect=Connect to a server
sh.create=Create a server on this computer
sh.myServer=My server
sh.why=Why:
sh.step.docker=Check Docker
sh.step.name=Server name
sh.step.internet=Internet
sh.step.ports=Ports and router
sh.step.options=Who can join
sh.step.install=Install
sh.step.finish=Connect phones
sh.explain.docker=Docker runs server components in separate containers. Install it yourself and select an unpacked, reviewed UNYRI release.
sh.why.docker=This gives Windows and Linux the same server environment.
sh.explain.name=Phones connect using a stable DNS name, without https:// or a path. Point its A record to your public IPv4.
sh.why.name=The name is used for HTTPS certificates and saved in accounts.
sh.explain.internet=The LAN address is used for forwarding. Find WAN IPv4 in your router Internet page; the wizard does not sign in to the router.
sh.why.internet=An externally reachable IPv4 lets phones connect away from home Wi-Fi.
sh.explain.ports=Allow only the listed ports on the PC and forward them from the router to the PC LAN address.
sh.why.ports=The router needs to know which computer handles messages and calls.
sh.explain.options=Choose rooms and registration access. Direct calls work without rooms.
sh.why.options=Invites limit registration; rooms need extra resources and ports.
sh.explain.install=The wizard runs the selected release installer, waits for local health, then checks public HTTPS.
sh.why.install=These checks separate installation failures from DNS or router problems.
sh.explain.finish=Save the address and claim ownership on your phone.
sh.why.finish=The one-time code gives your account owner privileges.
sh.dockerWindows=Use Docker Desktop with its WSL 2 backend running, Linux containers and Compose 2.24+. Installation may require a restart.
sh.dockerLinux=Use Docker Engine, Compose plugin 2.24+, Bash, curl and openssl. Your account needs access to the local Engine.
sh.dockerMissing=Docker is not ready. Start the local Linux Engine / WSL 2 and check Compose. Remote Docker contexts are refused.
sh.dockerReady=Local Docker and Compose are ready.
sh.downloadDocker=Official Docker installation
sh.checkAgain=Check again
sh.bundleHint=Select a separate reviewed SH-5 release with scripts/selfhost/install and docker-compose.selfhost.yml. One home server per Docker Engine.
sh.chooseBundle=Choose release folder
sh.domain=Own domain
sh.duck=Free DuckDNS name
sh.dnsName=DNS name, e.g. family.duckdns.org
sh.duckHint=Create a DuckDNS name. The token is saved only in a protected local file. Updates here are manual; configure an updater using the service instructions for continuous operation.
sh.duckSetup=Open DuckDNS instructions
sh.duckToken=DuckDNS token (hidden)
sh.saveToken=Save to protected file
sh.tokenSaved=Token saved locally; entry cleared.
sh.duckConsent=Allow sending the token, name and this IPv4 to DuckDNS to update DNS.
sh.updateDdns=Update DuckDNS name
sh.ddnsUpdated=DuckDNS accepted the update. Allow time for DNS propagation.
sh.unyriSoon=UNYRI name — coming soon
