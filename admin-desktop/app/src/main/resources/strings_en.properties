sh.routerHelp=Open the router address in a browser and sign in to its settings. Do not enter the router password in UNYRI. Reserve the computer’s home address. Find “Port forwarding” or “Virtual server” and direct the listed channels to this computer. A helper can find more under “Details”. After saving, test a phone with Wi-Fi off.
