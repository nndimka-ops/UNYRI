sh.inviteHint=Registration starts open so you can create your account. Use your private code to become the owner, open server management in a browser and turn on registration by invitation only. Create invitations there too. This checkbox is only a reminder; it does not change the settings.
sh.openHint=Anyone who knows the server address can register. After becoming the owner, you can change this in server management.
sh.sourceWarning=A ready-to-install package was not found or the usual installation failed. The server can be prepared from a full source package. This can take tens of minutes and needs plenty of free memory and disk space. If unsure, ask someone to check the package.
sh.sourceConsent=Allow the longer server preparation from checked source files
sh.imageReady=A ready-to-install package was found. Installation will download the server parts it needs.
sh.installConsent=Installation downloads the required files and creates storage for server data on this computer. Keep the app open until it finishes. Private keys and passwords are not shown on screen.
